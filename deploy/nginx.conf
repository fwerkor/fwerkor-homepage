server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /srv/homepage;
    index index.html;
    charset utf-8;
    server_tokens off;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}
